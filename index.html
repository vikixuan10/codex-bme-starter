<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>嘉宜的 Codex 入门 Skill</title>
    <style>
      :root {
        --bg: #f4f1ea;
        --text: #171b24;
        --muted: #667085;
        --soft: #eef3fb;
        --button: #1f5faa;
        --button-hover: #194f8f;
        --panel: #fffdf8;
        --line: #e3ded4;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      main {
        width: min(560px, 100%);
        padding: clamp(26px, 5vw, 44px);
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--panel);
        box-shadow: 0 20px 60px rgba(23, 27, 36, 0.08);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--button);
        font-size: 0.95rem;
        font-weight: 800;
        line-height: 1.45;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 6vw, 3.4rem);
        line-height: 1.08;
        letter-spacing: 0;
      }

      p {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 1.06rem;
        line-height: 1.6;
      }

      ol {
        margin: 30px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
      }

      li {
        display: grid;
        grid-template-columns: 30px 1fr;
        gap: 12px;
        align-items: center;
        color: var(--text);
        font-size: 1.02rem;
        line-height: 1.45;
      }

      .num {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--soft);
        color: var(--button);
        font-weight: 800;
        font-size: 0.95rem;
      }

      button {
        width: 100%;
        min-height: 56px;
        margin-top: 28px;
        border: 0;
        border-radius: 12px;
        background: var(--button);
        color: #fff;
        font: inherit;
        font-size: 1.05rem;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(31, 95, 170, 0.2);
      }

      button:hover {
        background: var(--button-hover);
      }

      .status {
        min-height: 26px;
        margin-top: 14px;
        color: #22714f;
        font-weight: 750;
        line-height: 1.45;
      }

      textarea {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
      }

      @media (max-width: 520px) {
        body {
          padding: 14px;
          align-items: stretch;
        }

        main {
          margin: 0;
          min-height: calc(100vh - 28px);
          display: flex;
          flex-direction: column;
          justify-content: center;
        }

        h1 {
          font-size: 2.35rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">嘉宜，这是给你（帝国理工生物医学工程本科生）用的</p>
      <h1>Codex 入门 Skill</h1>
      <p>点一下复制，然后把提示词发给 Codex。剩下的让 Agent 自己安装。</p>

      <ol aria-label="使用步骤">
        <li><span class="num">1</span><span>点击下面的复制按钮。</span></li>
        <li><span class="num">2</span><span>打开 Codex，新建一个对话。</span></li>
        <li><span class="num">3</span><span>粘贴发送，Codex 会帮你安装并开始训练。</span></li>
      </ol>

      <button id="copyPrompt" type="button">复制提示词</button>
      <div class="status" id="status" aria-live="polite"></div>
      <textarea id="prompt" readonly></textarea>
    </main>

    <script>
      const zipUrl =
        "https://raw.githubusercontent.com/vikixuan10/codex-bme-starter/main/assets/imperial-bme-codex-starter.zip";

      const promptText = `请帮我安装这个 Codex Skill：\n${zipUrl}\n\n请直接替我完成安装，不要只给我说明。\n\n步骤：\n1. 下载这个 zip。\n2. 解压后确认里面有 imperial-bme-codex-starter/SKILL.md。\n3. 把 imperial-bme-codex-starter 文件夹安装到 ~/.agents/skills/imperial-bme-codex-starter。\n4. 安装后验证 SKILL.md 存在。\n5. 如果需要我重启 Codex，请直接告诉我。\n6. 完成后，让我发送这句话开始：\n   用 $imperial-bme-codex-starter 带我做一遍 Codex 新手互动训练。`;

      const promptBox = document.querySelector("#prompt");
      const status = document.querySelector("#status");
      promptBox.value = promptText;

      document.querySelector("#copyPrompt").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(promptText);
          status.textContent = "已复制。现在打开 Codex，粘贴发送就可以。";
        } catch {
          promptBox.style.position = "fixed";
          promptBox.style.left = "12px";
          promptBox.style.top = "12px";
          promptBox.style.width = "calc(100% - 24px)";
          promptBox.style.height = "220px";
          promptBox.focus();
          promptBox.select();
          status.textContent = "浏览器没有允许自动复制，提示词已显示出来，可以手动复制。";
        }
      });
    </script>
  </body>
</html>
