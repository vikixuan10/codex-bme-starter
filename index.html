<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>嘉宜的 Codex 入门 Skill</title>
    <style>
      :root {
        --bg: #f7f5f0;
        --text: #171b24;
        --muted: #626b7a;
        --line: #ded9cf;
        --button: #1f5faa;
        --button-hover: #194f8f;
        --panel: #fffefa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      main {
        width: min(680px, 100%);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: 0 22px 70px rgba(23, 27, 36, 0.1);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 4.2rem);
        line-height: 1.04;
        letter-spacing: 0;
      }

      p {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.65;
      }

      ol {
        margin: 28px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 12px;
      }

      li {
        display: grid;
        grid-template-columns: 32px 1fr;
        gap: 12px;
        align-items: center;
        color: var(--text);
        font-size: 1rem;
      }

      .num {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #e8eef8;
        color: var(--button);
        font-weight: 800;
      }

      button {
        width: 100%;
        min-height: 58px;
        margin-top: 30px;
        border: 0;
        border-radius: 9px;
        background: var(--button);
        color: #fff;
        font: inherit;
        font-size: 1.08rem;
        font-weight: 800;
        cursor: pointer;
      }

      button:hover {
        background: var(--button-hover);
      }

      .status {
        min-height: 26px;
        margin-top: 14px;
        color: #22714f;
        font-weight: 750;
      }

      textarea {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>嘉宜，这是给你（帝国理工生物医学工程本科生）用的 Codex 入门 Skill</h1>
      <p>进入页面后，你只需要点击下面的按钮，然后把复制出来的内容发给 Codex。</p>

      <ol aria-label="使用步骤">
        <li><span class="num">1</span><span>点击“复制给 Codex 的提示词”。</span></li>
        <li><span class="num">2</span><span>打开 Codex，新建一个对话。</span></li>
        <li><span class="num">3</span><span>粘贴并发送，Codex 会帮你安装并开始训练。</span></li>
      </ol>

      <button id="copyPrompt" type="button">复制给 Codex 的提示词</button>
      <div class="status" id="status" aria-live="polite"></div>
      <textarea id="prompt" readonly></textarea>
    </main>

    <script>
      const zipUrl =
        "https://raw.githubusercontent.com/vikixuan10/codex-bme-starter/main/assets/imperial-bme-codex-starter.zip";

      const promptText = `请帮我安装这个 Codex Skill：\n${zipUrl}\n\n请直接替我完成安装，不要只给我说明。\n\n步骤：\n1. 下载这个 zip。\n2. 解压后确认里面有 imperial-bme-codex-starter/SKILL.md。\n3. 把 imperial-bme-codex-starter 文件夹安装到 ~/.agents/skills/imperial-bme-codex-starter。\n4. 安装后验证 SKILL.md 存在。\n5. 如果需要我重启 Codex，请直接告诉我。\n6. 完成后，让我发送这句话开始：\n   用 $imperial-bme-codex-starter 带我做一遍 Codex 新手互动训练。`;

      const promptBox = document.querySelector("#prompt");
      const status = document.querySelector("#status");
      promptBox.value = promptText;

      document.querySelector("#copyPrompt").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(promptText);
          status.textContent = "已复制。现在打开 Codex，粘贴发送就可以。";
        } catch {
          promptBox.style.position = "fixed";
          promptBox.style.left = "12px";
          promptBox.style.top = "12px";
          promptBox.style.width = "calc(100% - 24px)";
          promptBox.style.height = "220px";
          promptBox.focus();
          promptBox.select();
          status.textContent = "浏览器没有允许自动复制，提示词已显示出来，可以手动复制。";
        }
      });
    </script>
  </body>
</html>
